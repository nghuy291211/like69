<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ TikTok</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* Navbar Header */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-badge {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Container Layout */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        /* Modal Đăng nhập */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            cursor: pointer;
            color: #94a3b8;
        }

        /* Responsive grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Thanh Điều Hướng (Navbar) -->
    <nav class="navbar">
        <div class="logo">
            <i class="fa-brands fa-tiktok"></i> TikTok Agency System
        </div>
        <div class="user-nav" id="navGuest">
            <button class="btn" onclick="openModal()" style="width: auto;"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>
        </div>
        <div class="user-nav" id="navUser" style="display: none;">
            <span class="balance-badge"><i class="fa-solid fa-wallet"></i> <span id="userBalance">0</span> VNĐ</span>
            <span><i class="fa-solid fa-user"></i> <b id="usernameDisplay">User</b></span>
            <button class="btn btn-danger" onclick="logout()" style="width: auto; padding: 6px 12px;"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <div class="container">

        <!-- BẢNG QUẢN TRỊ (ADMIN) - Chỉ hiện khi tài khoản là Admin -->
        <div class="card" id="adminPanel" style="display: none; border-color: var(--primary);">
            <div class="card-title" style="color: #a5b4fc;">
                <i class="fa-solid fa-user-shield"></i> Bảng Quản Trị Hệ Thống (Admin)
            </div>
            
            <div class="grid-2">
                <!-- Tạo tài khoản con -->
                <div>
                    <h4>Tạo tài khoản người dùng</h4>
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="adminNewUser" placeholder="Tên tài khoản mới">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="adminNewPass" placeholder="Mật khẩu">
                    </div>
                    <div class="form-group">
                        <label>Số dư khởi tạo (VNĐ)</label>
                        <input type="number" id="adminNewBalance" value="0">
                    </div>
                    <button class="btn" onclick="adminCreateUser()">Tạo Tài Khoản</button>
                </div>

                <!-- Cộng / Trừ tiền người dùng -->
                <div>
                    <h4>Cài đặt số dư người dùng</h4>
                    <div class="form-group">
                        <label>ID Người dùng (User ID)</label>
                        <input type="number" id="adminTargetUserId" placeholder="Nhập ID tài khoản">
                    </div>
                    <div class="form-group">
                        <label>Số tiền thay đổi (+ hoặc -)</label>
                        <input type="number" id="adminAmount" placeholder="Ví dụ: 50000 hoặc -20000">
                    </div>
                    <button class="btn" style="background-color: var(--accent);" onclick="adminUpdateBalance()">Cập Nhật Số Dư</button>
                </div>
            </div>
        </div>

        <!-- FORM ĐẶT ĐƠN TIKTOK -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-cart-plus"></i> Tạo Đơn Dịch Vụ TikTok
            </div>
            
            <div class="form-group">
                <label>Chọn dịch vụ cần Buff</label>
                <select id="serviceSelect" onchange="updatePrice()">
                    <option value="1" data-price="20">Buff Like TikTok - Nhanh (20 VNĐ / Like)</option>
                    <option value="2" data-price="10">Buff Lượt xem (View) TikTok (10 VNĐ / View)</option>
                    <option value="3" data-price="50">Buff Người theo dõi (Follow) TikTok (50 VNĐ / Follow)</option>
                    <option value="4" data-price="30">Buff Comment TikTok (30 VNĐ / Comment)</option>
                    <option value="5" data-price="15">Buff Chia sẻ (Share) TikTok (15 VNĐ / Share)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Link bài viết hoặc Link kênh TikTok</label>
                <input type="text" id="orderLink" placeholder="https://www.tiktok.com/@username/video/123456789">
            </div>

            <div class="form-group">
                <label>Số lượng</label>
                <input type="number" id="orderQuantity" placeholder="Nhập số lượng (Ví dụ: 1000)" value="1000" oninput="updatePrice()">
            </div>

            <div class="form-group" style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px;">
                <label style="margin:0;">Tổng chi phí dự tính:</label>
                <h3 style="margin: 5px 0 0 0; color: var(--accent);" id="totalPriceDisplay">20,000 VNĐ</h3>
            </div>

            <button class="btn" onclick="submitOrder()"><i class="fa-solid fa-paper-plane"></i> Đặt Đơn Ngay</button>
        </div>

        <!-- FORM KIỂM TRA TIẾN ĐỘ -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-magnifying-glass"></i> Tra Cứu Tiến Độ Đơn Hàng
            </div>
            <div class="form-group">
                <label>Mã đơn nội bộ</label>
                <input type="text" id="checkOrderId" placeholder="Nhập mã đơn hàng của bạn">
            </div>
            <button class="btn" style="background-color: #475569;" onclick="checkStatus()">Kiểm Tra Tiến Độ</button>

            <div id="statusResult" style="margin-top: 15px; display: none; padding: 12px; background-color: #0f172a; border-radius: 6px;"></div>
        </div>

    </div>

    <!-- Modal Đăng Nhập -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            <h3 style="margin-top: 0;">Đăng Nhập Hệ Thống</h3>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="loginUser">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPass">
            </div>
            <button class="btn" onclick="login()">Đăng Nhập</button>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('loginModal').style.display = 'none'; }

        // Cập nhật giá tiền real-time
        function updatePrice() {
            const select = document.getElementById('serviceSelect');
            const pricePerItem = parseInt(select.options[select.selectedIndex].getAttribute('data-price'));
            const quantity = parseInt(document.getElementById('orderQuantity').value) || 0;
            const total = pricePerItem * quantity;
            document.getElementById('totalPriceDisplay').innerText = total.toLocaleString('vi-VN') + ' VNĐ';
        }

        // Đăng nhập
        async function login() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', username);
                localStorage.setItem('role', data.role);
                localStorage.setItem('balance', data.balance);
                closeModal();
                checkAuth();
            } else {
                alert(data.error);
            }
        }

        // Kiểm tra trạng thái đăng nhập khi load trang
        function checkAuth() {
            const token = localStorage.getItem('token');
            const role = localStorage.getItem('role');
            const username = localStorage.getItem('username');
            const balance = localStorage.getItem('balance');

            if (token) {
                document.getElementById('navGuest').style.display = 'none';
                document.getElementById('navUser').style.display = 'flex';
                document.getElementById('usernameDisplay').innerText = username;
                document.getElementById('userBalance').innerText = parseFloat(balance).toLocaleString('vi-VN');

                if (role === 'admin') {
                    document.getElementById('adminPanel').style.display = 'block';
                }
            } else {
                document.getElementById('navGuest').style.display = 'flex';
                document.getElementById('navUser').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'none';
            }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // Admin: Tạo tài khoản con
        async function adminCreateUser() {
            const username = document.getElementById('adminNewUser').value;
            const password = document.getElementById('adminNewPass').value;
            const initial_balance = document.getElementById('adminNewBalance').value;

            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ username, password, initial_balance, role: 'user' })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        // Admin: Cập nhật số dư
        async function adminUpdateBalance() {
            const userId = document.getElementById('adminTargetUserId').value;
            const amount = parseFloat(document.getElementById('adminAmount').value);

            const res = await fetch('/api/admin/update-balance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ userId, amount })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        // Đặt đơn
        async function submitOrder() {
            const select = document.getElementById('serviceSelect');
            const service = select.value;
            const pricePerItem = parseInt(select.options[select.selectedIndex].getAttribute('data-price'));
            const link = document.getElementById('orderLink').value;
            const quantity = parseInt(document.getElementById('orderQuantity').value);

            const res = await fetch('/api/order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify({ service, link, quantity, pricePerItem })
            });
            const data = await res.json();
            if (res.ok) {
                alert(`Đặt đơn thành công! Mã đơn nội bộ: ${data.localOrderId}`);
            } else {
                alert(data.error);
            }
        }

        // Kiểm tra tiến độ
        async function checkStatus() {
            const orderId = document.getElementById('checkOrderId').value;
            const res = await fetch(`/api/order/status/${orderId}`, {
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
            });
            const data = await res.json();
            const resultDiv = document.getElementById('statusResult');
            resultDiv.style.display = 'block';

            if (res.ok) {
                resultDiv.innerHTML = `<span style="color: var(--accent);">Mã đơn API: ${data.apiOrderId}</span><br>Trạng thái: <b>${data.status}</b> | Số lượng còn lại: <b>${data.remains}</b>`;
            } else {
                resultDiv.innerHTML = `<span style="color: var(--danger);">${data.error}</span>`;
            }
        }

        // Khởi chạy khi tải trang
        checkAuth();
        updatePrice();
    </script>
</body>
</html>
