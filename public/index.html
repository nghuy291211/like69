<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SieuLike - Hệ Thống Dịch Vụ Mạng Xã Hội</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-green: #10b981;
            --text-color: #f9fafb;
            --purple-accent: #8b5cf6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card-bg); padding: 14px 20px;
            border-bottom: 1px solid #1f2937;
        }

        .logo { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .logo span { color: var(--border-green); }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        .btn {
            padding: 8px 16px; border-radius: 8px; border: none;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-green { background-color: var(--border-green); color: #fff; }
        .btn-purple { background-color: var(--purple-accent); color: #fff; }

        /* Accordion Menu */
        .accordion-item {
            background-color: #161f2e; border: 1px solid #1f2937;
            border-radius: 12px; margin-bottom: 10px; overflow: hidden;
        }
        .accordion-header {
            padding: 15px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; font-weight: bold;
        }
        .accordion-content { display: none; padding: 10px; background-color: #0f172a; }
        .accordion-item.active .accordion-content { display: block; }

        .service-row {
            padding: 10px; border-radius: 8px; background-color: #182232;
            margin-bottom: 8px; display: flex; justify-content: space-between; cursor: pointer;
        }
        .service-row:hover { background-color: #233146; }

        /* Modal Forms */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-body {
            background-color: var(--card-bg); padding: 25px; border-radius: 16px;
            width: 90%; max-width: 380px; border: 1px solid #374151;
        }
        .form-group { margin-bottom: 12px; }
        input {
            width: 100%; padding: 10px; background: #0b0f19;
            border: 1px solid #374151; border-radius: 8px; color: #fff; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-bolt"></i> SIEU<span>LIKE</span>.COM</div>
        <div id="guestMenu">
            <button class="btn btn-green" onclick="showModal('loginModal')">Đăng nhập</button>
            <button class="btn btn-purple" onclick="showModal('regModal')">Đăng ký</button>
        </div>
        <div id="userMenu" style="display: none;">
            <span><i class="fa-solid fa-wallet" style="color:var(--border-green);"></i> <b id="uBalance">0</b> đ</span> | 
            <span id="uName"></span>
            <button class="btn btn-purple" id="adminBtn" style="display:none;" onclick="showModal('adminModal')">ADMIN</button>
            <button class="btn" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </div>

    <div class="container">
        <!-- DANH SÁCH MỤC DỊCH VỤ ACCORDION CHUẨN GIAO DIỆN MẪU -->
        <div class="accordion-item" id="acc-tim">
            <div class="accordion-header" onclick="toggleAcc('acc-tim')">
                <span><i class="fa-solid fa-heart" style="color:#ec4899;"></i> Tim TikTok</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="accordion-content">
                <div class="service-row" onclick="alert('Đã chọn dịch vụ!')">
                    <span>🔥 TikTok - Tim - Người nước ngoài</span>
                    <b style="color:var(--border-green);">3.73đ</b>
                </div>
            </div>
        </div>

        <div class="accordion-item" id="acc-view">
            <div class="accordion-header" onclick="toggleAcc('acc-view')">
                <span><i class="fa-solid fa-eye" style="color:#3b82f6;"></i> Lượt xem TikTok</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <div class="accordion-content">
                <div class="service-row">
                    <span>⚡ Lượt xem siêu tốc</span>
                    <b style="color:var(--border-green);">1.2đ</b>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ĐĂNG KÝ -->
    <div class="modal" id="regModal">
        <div class="modal-body">
            <h3>Đăng ký tài khoản mới</h3>
            <div class="form-group"><input type="text" id="regUser" placeholder="Tên đăng nhập"></div>
            <div class="form-group"><input type="password" id="regPass" placeholder="Mật khẩu"></div>
            <button class="btn btn-purple" style="width:100%;" onclick="register()">ĐĂNG KÝ</button>
            <p style="text-align:center; font-size: 0.8rem; cursor:pointer;" onclick="showModal('loginModal')">Đã có tài khoản? Đăng nhập</p>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal" id="loginModal">
        <div class="modal-body">
            <h3>Đăng nhập</h3>
            <div class="form-group"><input type="text" id="logUser" placeholder="Tên đăng nhập"></div>
            <div class="form-group"><input type="password" id="logPass" placeholder="Mật khẩu"></div>
            <button class="btn btn-green" style="width:100%;" onclick="login()">ĐĂNG NHẬP</button>
        </div>
    </div>

    <!-- MODAL PHẦN QUẢN TRỊ ADMIN -->
    <div class="modal" id="adminModal">
        <div class="modal-body">
            <h3 style="color:var(--purple-accent);">BẢNG QUẢN TRỊ ADMIN</h3>
            <p style="font-size:0.85rem; color:#9ca3af;">Cộng tiền cho thành viên hệ thống:</p>
            <div class="form-group"><input type="text" id="admTarget" placeholder="Tên tài khoản nhận tiền"></div>
            <div class="form-group"><input type="number" id="admAmount" placeholder="Số tiền cộng (VNĐ)"></div>
            <button class="btn btn-green" style="width:100%;" onclick="addBalanceAdmin()">CỘNG TIỀN</button>
            <button class="btn" style="width:100%; margin-top:5px;" onclick="hideModals()">Đóng</button>
        </div>
    </div>

    <script>
        function toggleAcc(id) {
            document.getElementById(id).classList.toggle('active');
        }

        function showModal(id) {
            hideModals();
            document.getElementById(id).style.display = 'flex';
        }

        function hideModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        async function register() {
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            alert(data.message || data.error);
            if (res.ok) showModal('loginModal');
        }

        async function login() {
            const username = document.getElementById('logUser').value;
            const password = document.getElementById('logPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('user', JSON.stringify(data));
                hideModals();
                loadUser();
            } else {
                alert(data.error);
            }
        }

        function loadUser() {
            const u = JSON.parse(localStorage.getItem('user'));
            if (u) {
                document.getElementById('guestMenu').style.display = 'none';
                document.getElementById('userMenu').style.display = 'block';
                document.getElementById('uName').innerText = u.username;
                document.getElementById('uBalance').innerText = u.balance.toLocaleString();
                if (u.role === 'admin') {
                    document.getElementById('adminBtn').style.display = 'inline-block';
                }
            }
        }

        async function addBalanceAdmin() {
            const u = JSON.parse(localStorage.getItem('user'));
            const targetUsername = document.getElementById('admTarget').value;
            const amount = document.getElementById('admAmount').value;

            const res = await fetch('/api/admin/add-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminUsername: u.username, targetUsername, amount })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        function logout() { localStorage.clear(); location.reload(); }
        loadUser();
    </script>
</body>
</html>
