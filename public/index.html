<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1"
>

<title>SIEULIKE.COM</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #080d17;
    color: #f5f7fb;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x: hidden;
}

button,
input,
select {
    font: inherit;
}

.navbar {
    width: 100%;
    min-height: 72px;
    padding: 12px 18px;
    background: #101827;
    border-bottom: 1px solid #263143;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    white-space: nowrap;
}

.logo span {
    color: #16d6a0;
}

.right {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.balance {
    white-space: nowrap;
    color: #fff;
}

.balance i {
    color: #16d6a0;
}

.username {
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.container {
    width: min(100% - 24px, 900px);
    margin: 20px auto 50px;
}

.card {
    width: 100%;
    background: #111a2a;
    border: 1px solid #334155;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
}

.card-header {
    min-height: 64px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background: #172237;
}

.card-header strong {
    font-size: 17px;
}

.card-body {
    display: none;
    padding: 12px;
    background: #0d1625;
}

.card.open .card-body {
    display: block;
}

.service {
    width: 100%;
    padding: 14px;
    margin-bottom: 8px;
    border: 1px solid #27364d;
    border-radius: 12px;
    background: #182438;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.service:last-child {
    margin-bottom: 0;
}

.service:hover {
    background: #203049;
}

.service-info {
    min-width: 0;
}

.service-name {
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
}

.service-desc {
    margin-top: 5px;
    color: #94a3b8;
    font-size: 12px;
}

.service-price {
    color: #35e4ae;
    font-weight: 800;
    white-space: nowrap;
}

.btn {
    border: 0;
    border-radius: 9px;
    padding: 9px 14px;
    color: #fff;
    cursor: pointer;
    font-weight: 700;
}

.btn-green {
    background: #10b981;
}

.btn-purple {
    background: #8b5cf6;
}

.btn-gray {
    background: #475569;
}

.btn-red {
    background: #dc2626;
}

.btn-full {
    width: 100%;
}

.form-group {
    margin-bottom: 12px;
}

label {
    display: block;
    margin-bottom: 6px;
    color: #cbd5e1;
    font-size: 13px;
}

input,
select {
    width: 100%;
    max-width: 100%;
    padding: 12px;
    border: 1px solid #334155;
    border-radius: 9px;
    background: #080f1c;
    color: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #8b5cf6;
}

.order-panel {
    display: none;
}

.order-panel.active {
    display: block;
}

.selected-service {
    padding: 12px;
    border-radius: 10px;
    background: #182438;
    margin-bottom: 14px;
}

.total-box {
    padding: 14px;
    border-radius: 10px;
    background: #101a2b;
    margin-bottom: 12px;
}

.total-box strong {
    color: #35e4ae;
    font-size: 20px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    padding: 16px;
    background: rgba(0,0,0,.78);
    align-items: center;
    justify-content: center;
    overflow-y: auto;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(100%, 520px);
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: #111827;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
}

.modal-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.close {
    border: 0;
    background: transparent;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.admin-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #263143;
}

.user-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.user-table th,
.user-table td {
    border-bottom: 1px solid #27364d;
    padding: 9px 6px;
    text-align: left;
}

.user-table th {
    color: #94a3b8;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

.empty {
    text-align: center;
    padding: 30px 10px;
    color: #94a3b8;
}

.alert {
    display: none;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
    background: #182438;
}

.alert.show {
    display: block;
}

.small {
    color: #94a3b8;
    font-size: 12px;
}

@media (max-width: 600px) {

    .navbar {
        padding: 10px 12px;
    }

    .logo {
        font-size: 16px;
    }

    .right {
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .balance {
        font-size: 13px;
    }

    .username {
        display: none;
    }

    .container {
        width: calc(100% - 16px);
        margin-top: 12px;
    }

    .card-header {
        padding: 14px 12px;
    }

    .card-body {
        padding: 8px;
    }

    .service {
        padding: 12px 10px;
    }

    .service-price {
        font-size: 13px;
    }

}

</style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        <i class="fa-solid fa-bolt"></i>
        SIEU<span>LIKE</span>.COM
    </div>

    <div class="right" id="guestMenu">

        <button
            class="btn btn-green"
            onclick="openModal('loginModal')"
        >
            Đăng nhập
        </button>

        <button
            class="btn btn-purple"
            onclick="openModal('registerModal')"
        >
            Đăng ký
        </button>

    </div>

    <div
        class="right"
        id="userMenu"
        style="display:none"
    >

        <span class="balance">
            <i class="fa-solid fa-wallet"></i>
            <b id="balance">0</b>đ
        </span>

        <span
            class="username"
            id="username"
        ></span>

        <button
            id="adminButton"
            class="btn btn-purple"
            style="display:none"
            onclick="openAdmin()"
        >
            ADMIN
        </button>

        <button
            class="btn btn-gray"
            onclick="logout()"
        >
            <i class="fa-solid fa-power-off"></i>
        </button>

    </div>

</header>

<main class="container">

    <div
        id="message"
        class="alert"
    ></div>

    <div class="card">

        <div
            class="card-header"
            onclick="toggleCard(this)"
        >
            <strong>
                <i
                    class="fa-solid fa-list"
                    style="color:#10b981"
                ></i>
                Dịch vụ
            </strong>

            <i class="fa-solid fa-chevron-down"></i>
        </div>

        <div class="card-body" id="services">

            <div class="empty">
                Đang tải dịch vụ...
            </div>

        </div>

    </div>

    <div
        class="card"
        id="orderCard"
        style="display:none"
    >

        <div class="card-header">

            <strong>
                <i
                    class="fa-solid fa-cart-shopping"
                    style="color:#8b5cf6"
                ></i>
                Đặt đơn
            </strong>

            <button
                class="btn btn-gray"
                onclick="closeOrder()"
            >
                Đóng
            </button>

        </div>

        <div class="card-body" style="display:block">

            <div
                id="selectedService"
                class="selected-service"
            ></div>

            <div class="form-group">

                <label>Link bài viết/video</label>

                <input
                    id="orderLink"
                    type="url"
                    placeholder="https://..."
                >

            </div>

            <div class="form-group">

                <label>Số lượng</label>

                <input
                    id="orderQuantity"
                    type="number"
                    min="1"
                    placeholder="Nhập số lượng"
                    oninput="calculateTotal()"
                >

            </div>

            <div class="total-box">

                Thành tiền:
                <strong id="orderTotal">0đ</strong>

            </div>

            <button
                class="btn btn-green btn-full"
                onclick="createOrder()"
            >
                <i class="fa-solid fa-paper-plane"></i>
                ĐẶT ĐƠN
            </button>

        </div>

    </div>

    <div
        class="card"
        id="ordersCard"
        style="display:none"
    >

        <div
            class="card-header"
            onclick="toggleCard(this)"
        >
            <strong>
                <i
                    class="fa-solid fa-clock-rotate-left"
                    style="color:#3b82f6"
                ></i>
                Đơn hàng của tôi
            </strong>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

        <div class="card-body">

            <div
                id="orders"
                class="empty"
            >
                Chưa có đơn hàng.
            </div>

        </div>

    </div>

</main>

<!-- LOGIN -->

<div
    class="modal"
    id="loginModal"
>

    <div class="modal-box">

        <div class="modal-title">

            <h3>Đăng nhập</h3>

            <button
                class="close"
                onclick="closeModals()"
            >
                ×
            </button>

        </div>

        <div class="form-group">

            <label>Tài khoản</label>

            <input
                id="loginUsername"
                type="text"
                autocomplete="username"
            >

        </div>

        <div class="form-group">

            <label>Mật khẩu</label>

            <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
            >

        </div>

        <button
            class="btn btn-green btn-full"
            onclick="login()"
        >
            ĐĂNG NHẬP
        </button>

    </div>

</div>

<!-- REGISTER -->

<div
    class="modal"
    id="registerModal"
>

    <div class="modal-box">

        <div class="modal-title">

            <h3>Đăng ký</h3>

            <button
                class="close"
                onclick="closeModals()"
            >
                ×
            </button>

        </div>

        <div class="form-group">

            <label>Tài khoản</label>

            <input
                id="registerUsername"
                type="text"
            >

        </div>

        <div class="form-group">

            <label>Mật khẩu</label>

            <input
                id="registerPassword"
                type="password"
            >

        </div>

        <button
            class="btn btn-purple btn-full"
            onclick="register()"
        >
            ĐĂNG KÝ
        </button>

    </div>

</div>

<!-- ADMIN -->

<div
    class="modal"
    id="adminModal"
>

    <div class="modal-box">

        <div class="modal-title">

            <h3 style="color:#a78bfa">
                QUẢN TRỊ
            </h3>

            <button
                class="close"
                onclick="closeModals()"
            >
                ×
            </button>

        </div>

        <!-- API BALANCE -->

        <div class="card" style="margin:0 0 15px">

            <div class="card-header">

                <strong>
                    <i class="fa-solid fa-wallet"></i>
                    Số dư API mẹ
                </strong>

                <button
                    class="btn btn-green"
                    onclick="loadProviderBalance()"
                >
                    Làm mới
                </button>

            </div>

            <div
                class="card-body"
                style="display:block"
            >

                <div
                    style="font-size:25px;font-weight:800"
                    id="providerBalance"
                >
                    Đang tải...
                </div>

                <div class="small">
                    Số dư được gọi trực tiếp từ API mẹ.
                </div>

            </div>

        </div>

        <!-- BALANCE USER -->

        <div class="admin-section">

            <h4>Điều chỉnh số dư người dùng</h4>

            <div class="form-group">

                <label>Tài khoản</label>

                <input
                    id="targetUsername"
                    type="text"
                    placeholder="Tên tài khoản"
                >

            </div>

            <div class="form-group">

                <label>Số tiền</label>

                <input
                    id="balanceAmount"
                    type="number"
                    min="1"
                    placeholder="VNĐ"
                >

            </div>

            <div style="display:flex;gap:8px">

                <button
                    class="btn btn-green"
                    style="flex:1"
                    onclick="changeBalance('add')"
                >
                    + CỘNG
                </button>

                <button
                    class="btn btn-red"
                    style="flex:1"
                    onclick="changeBalance('subtract')"
                >
                    − TRỪ
                </button>

            </div>

        </div>

        <!-- USERS -->

        <div class="admin-section">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center
                "
            >

                <h4>
                    Tài khoản đã đăng ký
                </h4>

                <button
                    class="btn btn-gray"
                    onclick="loadUsers()"
                >
                    Làm mới
                </button>

            </div>

            <div class="table-wrap">

                <table class="user-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Tài khoản</th>
                            <th>Quyền</th>
                            <th>Số dư</th>
                        </tr>

                    </thead>

                    <tbody id="userList">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

let selectedService = null;

// ======================================================
// COMMON
// ======================================================

function getUser() {

    try {
        return JSON.parse(
            localStorage.getItem("user")
        );
    } catch {
        return null;
    }

}

function getKey() {

    const user = getUser();

    return user?.api_key || "";

}

function money(value) {

    return Number(value || 0)
        .toLocaleString("vi-VN", {
            maximumFractionDigits: 2
        });

}

function showMessage(text, error = false) {

    const box =
        document.getElementById("message");

    box.textContent = text;
    box.style.color =
        error ? "#fecaca" : "#bbf7d0";

    box.classList.add("show");

    setTimeout(() => {
        box.classList.remove("show");
    }, 4000);

}

function openModal(id) {

    closeModals();

    document
        .getElementById(id)
        .classList.add("show");

}

function closeModals() {

    document
        .querySelectorAll(".modal")
        .forEach(x =>
            x.classList.remove("show")
        );

}

function toggleCard(header) {

    const card =
        header.parentElement;

    card.classList.toggle("open");

}

function logout() {

    localStorage.removeItem("user");

    location.reload();

}

// ======================================================
// REGISTER
// ======================================================

async function register() {

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    try {

        const response =
            await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

        const data =
            await response.json();

        if (!response.ok) {
            return showMessage(
                data.error ||
                "Đăng ký thất bại.",
                true
            );
        }

        showMessage(
            "Đăng ký thành công. Hãy đăng nhập."
        );

        closeModals();

        document
            .getElementById("loginUsername")
            .value = username;

    } catch (e) {

        showMessage(
            "Không kết nối được máy chủ.",
            true
        );

    }

}

// ======================================================
// LOGIN
// ======================================================

async function login() {

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    try {

        const response =
            await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

        const data =
            await response.json();

        if (!response.ok) {

            return showMessage(
                data.error ||
                "Đăng nhập thất bại.",
                true
            );

        }

        localStorage.setItem(
            "user",
            JSON.stringify(data)
        );

        closeModals();

        renderUser();

        loadServices();

    } catch {

        showMessage(
            "Không kết nối được máy chủ.",
            true
        );

    }

}

// ======================================================
// USER
// ======================================================

async function refreshMe() {

    const key = getKey();

    if (!key) return;

    try {

        const response =
            await fetch("/api/me", {
                headers: {
                    "x-api-key": key
                }
            });

        if (!response.ok) return;

        const data =
            await response.json();

        const oldUser =
            getUser();

        const newUser = {
            ...oldUser,
            ...data.user
        };

        localStorage.setItem(
            "user",
            JSON.stringify(newUser)
        );

        renderUser();

    } catch {}

}

function renderUser() {

    const user = getUser();

    if (!user) {

        document
            .getElementById("guestMenu")
            .style.display = "flex";

        document
            .getElementById("userMenu")
            .style.display = "none";

        document
            .getElementById("orderCard")
            .style.display = "none";

        document
            .getElementById("ordersCard")
            .style.display = "none";

        return;

    }

    document
        .getElementById("guestMenu")
        .style.display = "none";

    document
        .getElementById("userMenu")
        .style.display = "flex";

    document
        .getElementById("username")
        .textContent =
        user.username;

    document
        .getElementById("balance")
        .textContent =
        money(user.balance);

    if (user.role === "admin") {

        document
            .getElementById("adminButton")
            .style.display = "inline-block";

    }

    document
        .getElementById("ordersCard")
        .style.display = "block";

}

// ======================================================
// SERVICES
// ======================================================

async function loadServices() {

    const box =
        document.getElementById("services");

    box.innerHTML =
        `<div class="empty">
            Đang tải dịch vụ...
        </div>`;

    try {

        const response =
            await fetch("/api/services");

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Không tải được dịch vụ"
            );

        }

        const services =
            Array.isArray(data.services)
                ? data.services
                : [];

        if (!services.length) {

            box.innerHTML =
                `<div class="empty">
                    API mẹ chưa trả về dịch vụ.
                </div>`;

            return;

        }

        // Gom theo category nếu API có group
        const groups = {};

        services.forEach(service => {

            const category =
                service.category ||
                service.group ||
                "Dịch vụ";

            if (!groups[category]) {
                groups[category] = [];
            }

            groups[category].push(service);

        });

        box.innerHTML = "";

        Object.entries(groups)
            .forEach(
                ([category, list]) => {

                    const group =
                        document.createElement(
                            "div"
                        );

                    group.innerHTML =
                        `<div
                            style="
                                padding:10px 4px;
                                color:#94a3b8;
                                font-weight:700
                            "
                        >
                            ${escapeHtml(category)}
                        </div>`;

                    list.forEach(service => {

                        const row =
                            document.createElement(
                                "div"
                            );

                        row.className =
                            "service";

                        const rate =
                            Number(
                                service.rate || 0
                            );

                        row.innerHTML = `
                            <div class="service-info">
                                <div class="service-name">
                                    ${escapeHtml(
                                        service.name ||
                                        "Dịch vụ #" +
                                        service.service
                                    )}
                                </div>

                                <div class="service-desc">
                                    ID: ${escapeHtml(
                                        service.service
                                    )}

                                    ${
                                        service.min
                                            ? ` • Min: ${escapeHtml(service.min)}`
                                            : ""
                                    }

                                    ${
                                        service.max
                                            ? ` • Max: ${escapeHtml(service.max)}`
                                            : ""
                                    }
                                </div>
                            </div>

                            <div class="service-price">
                                ${money(rate)}đ
                                <small>/1K</small>
                            </div>
                        `;

                        row.onclick =
                            () =>
                                selectService(
                                    service
                                );

                        group.appendChild(row);

                    });

                    box.appendChild(group);

                }
            );

    } catch (e) {

        box.innerHTML =
            `<div class="empty">
                ${escapeHtml(e.message)}
            </div>`;

    }

}

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

// ======================================================
// SELECT SERVICE
// ======================================================

function selectService(service) {

    const user = getUser();

    if (!user) {

        openModal("loginModal");

        showMessage(
            "Bạn cần đăng nhập trước khi đặt đơn.",
            true
        );

        return;

    }

    selectedService = service;

    const rate =
        Number(service.rate || 0);

    const min =
        Number(service.min || 1);

    const max =
        Number(service.max || 0);

    document
        .getElementById("selectedService")
        .innerHTML = `
            <b>
                ${escapeHtml(
                    service.name ||
                    "Dịch vụ #" +
                    service.service
                )}
            </b>

            <div class="small">
                Giá:
                ${money(rate)}đ / 1000
                ${
                    max
                        ? ` • ${min} - ${max}`
                        : ""
                }
            </div>
        `;

    const quantity =
        document.getElementById(
            "orderQuantity"
        );

    quantity.min = min;

    if (max) {
        quantity.max = max;
    }

    quantity.value = "";

    document
        .getElementById("orderLink")
        .value = "";

    document
        .getElementById("orderTotal")
        .textContent = "0đ";

    document
        .getElementById("orderCard")
        .style.display = "block";

    document
        .getElementById("orderCard")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}

function closeOrder() {

    selectedService = null;

    document
        .getElementById("orderCard")
        .style.display = "none";

}

function calculateTotal() {

    if (!selectedService) return;

    const quantity =
        Number(
            document
                .getElementById("orderQuantity")
                .value
        );

    const rate =
        Number(
            selectedService.rate || 0
        );

    const total =
        quantity > 0
            ? quantity / 1000 * rate
            : 0;

    document
        .getElementById("orderTotal")
        .textContent =
        money(total) + "đ";

}

// ======================================================
// ORDER
// ======================================================

async function createOrder() {

    const user = getUser();

    if (!user) {
        return openModal("loginModal");
    }

    if (!selectedService) {
        return showMessage(
            "Chưa chọn dịch vụ.",
            true
        );
    }

    const link =
        document
            .getElementById("orderLink")
            .value
            .trim();

    const quantity =
        Number(
            document
                .getElementById("orderQuantity")
                .value
        );

    const min =
        Number(
            selectedService.min || 1
        );

    const max =
        Number(
            selectedService.max || 0
        );

    if (!link) {

        return showMessage(
            "Vui lòng nhập link.",
            true
        );

    }

    if (
        !Number.isInteger(quantity) ||
        quantity < min
    ) {

        return showMessage(
            `Số lượng tối thiểu là ${min}.`,
            true
        );

    }

    if (
        max &&
        quantity > max
    ) {

        return showMessage(
            `Số lượng tối đa là ${max}.`,
            true
        );

    }

    const total =
        quantity /
        1000 *
        Number(selectedService.rate || 0);

    if (
        Number(user.balance || 0) <
        total
    ) {

        return showMessage(
            "Số dư không đủ.",
            true
        );

    }

    if (
        !confirm(
            `Xác nhận đặt đơn ${money(total)}đ?`
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch("/api/order", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                    "x-api-key":
                        getKey()
                },
                body: JSON.stringify({
                    service:
                        selectedService.service,
                    link,
                    quantity
                })
            });

        const data =
            await response.json();

        if (!response.ok) {

            return showMessage(
                data.error ||
                "Đặt đơn thất bại.",
                true
            );

        }

        showMessage(
            `Đặt đơn thành công! Mã đơn: ${data.order}`
        );

        const current =
            getUser();

        current.balance =
            Number(data.balance);

        localStorage.setItem(
            "user",
            JSON.stringify(current)
        );

        renderUser();

        closeOrder();

        loadOrders();

    } catch {

        showMessage(
            "Không kết nối được máy chủ.",
            true
        );

    }

}

// ======================================================
// ORDERS
// ======================================================

async function loadOrders() {

    if (!getKey()) return;

    try {

        const response =
            await fetch("/api/orders", {
                headers: {
                    "x-api-key":
                        getKey()
                }
            });

        const data =
            await response.json();

        if (!response.ok) return;

        const box =
            document.getElementById(
                "orders"
            );

        if (!data.orders?.length) {

            box.innerHTML =
                "Chưa có đơn hàng.";

            return;

        }

        box.innerHTML =
            data.orders.map(order => `
                <div
                    style="
                        padding:12px;
                        margin-bottom:8px;
                        background:#182438;
                        border-radius:10px
                    "
                >
                    <b>
                        #${escapeHtml(order.provider_order_id || order.id)}
                    </b>

                    <div class="small">
                        ${escapeHtml(
                            order.service_name ||
                            order.service_id
                        )}
                    </div>

                    <div>
                        SL:
                        ${money(order.quantity)}
                    </div>

                    <div>
                        Tiền:
                        ${money(order.total)}đ
                    </div>

                    <div
                        class="small"
                    >
                        ${escapeHtml(order.status)}
                    </div>
                </div>
            `).join("");

    } catch {}

}

// ======================================================
// ADMIN
// ======================================================

function openAdmin() {

    const user = getUser();

    if (!user || user.role !== "admin") {

        return showMessage(
            "Bạn không có quyền quản trị.",
            true
        );

    }

    openModal("adminModal");

    loadProviderBalance();

    loadUsers();

}

async function loadProviderBalance() {

    const box =
        document.getElementById(
            "providerBalance"
        );

    box.textContent =
        "Đang tải...";

    try {

        const response =
            await fetch(
                "/api/admin/provider-balance",
                {
                    headers: {
                        "x-api-key":
                            getKey()
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error
            );

        }

        box.textContent =
            money(data.balance) +
            " " +
            (data.currency || "VND");

    } catch (e) {

        box.textContent =
            e.message ||
            "Không lấy được số dư.";

    }

}

async function loadUsers() {

    const body =
        document.getElementById(
            "userList"
        );

    body.innerHTML =
        `<tr>
            <td colspan="4">
                Đang tải...
            </td>
        </tr>`;

    try {

        const response =
            await fetch(
                "/api/admin/users",
                {
                    headers: {
                        "x-api-key":
                            getKey()
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error
            );
        }

        body.innerHTML =
            data.users.map(user => `
                <tr>
                    <td>${user.id}</td>

                    <td>
                        ${escapeHtml(user.username)}
                    </td>

                    <td>
                        ${escapeHtml(user.role)}
                    </td>

                    <td>
                        ${money(user.balance)}đ
                    </td>
                </tr>
            `).join("");

    } catch (e) {

        body.innerHTML =
            `<tr>
                <td colspan="4">
                    ${escapeHtml(e.message)}
                </td>
            </tr>`;

    }

}

async function changeBalance(type) {

    const username =
        document
            .getElementById(
                "targetUsername"
            )
            .value
            .trim();

    const amount =
        Number(
            document
                .getElementById(
                    "balanceAmount"
                )
                .value
        );

    if (!username || amount <= 0) {

        return showMessage(
            "Nhập tài khoản và số tiền.",
            true
        );

    }

    try {

        const response =
            await fetch(
                "/api/admin/balance",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json",
                        "x-api-key":
                            getKey()
                    },
                    body: JSON.stringify({
                        username,
                        amount,
                        type
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            return showMessage(
                data.error,
                true
            );

        }

        showMessage(
            data.message +
            " Số dư mới: " +
            money(data.balance) +
            "đ"
        );

        loadUsers();

    } catch {

        showMessage(
            "Không kết nối được máy chủ.",
            true
        );

    }

}

// ======================================================
// START
// ======================================================

renderUser();

loadServices();

if (getUser()) {

    refreshMe();

    loadOrders();

}

</script>
