<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập System SMM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 35px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; font-size: 24px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #059669; }
        #error { color: #f87171; text-align: center; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Đăng Nhập System</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>Tài khoản</label>
            <input type="text" id="username" required placeholder="Tên đăng nhập">
        </div>
        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" required placeholder="Mật khẩu">
        </div>
        <button type="submit">Đăng Nhập</button>
    </form>
    <div id="error"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/index.html';
        } else {
            const err = document.getElementById('error');
            err.style.display = 'block';
            err.innerText = data.message;
        }
    });
</script>
</body>
</html>
