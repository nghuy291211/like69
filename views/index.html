<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ TikTok Auto API</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background: #090d16; color: #f1f5f9; padding: 16px 12px; }
        .container { max-width: 520px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 8px; }
        .btn { border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-login { background: #10b981; color: #fff; }
        .btn-logout { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .user-info-tag { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); padding: 6px 10px; border-radius: 10px; font-size: 12px; color: #38bdf8; font-weight: 600; }
        .balance-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .balance-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.06); padding: 14px; border-radius: 16px; }
        .balance-title { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .balance-value { font-size: 18px; font-weight: 800; margin-top: 4px; color: #34d399; }
        .balance-value.api { color: #38bdf8; }
        .card { background: #0f172a; border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.06); }
        .main-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #050811; padding: 5px; border-radius: 14px; margin-bottom: 20px; gap: 2px; }
        .tab-item { text-align: center; padding: 10px 2px; border-radius: 10px; font-size: 10px; font-weight: 700; color: #64748b; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-item.active { background: #1e293b; color: #38bdf8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #1e293b; background: #070a12; color: #fff; font-size: 13px; outline: none; }
        .total-box { background: rgba(7, 10, 18, 0.7); border: 1px dashed rgba(52, 211, 153, 0.3); padding: 14px; border-radius: 14px; text-align: center; margin: 18px 0; }
        .total-price { font-size: 22px; font-weight: 800; color: #34d399; margin-top: 4px; }
        button.btn-submit { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 24px; border-radius: 20px; width: 90%; max-width: 360px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .list-item { background: #070a12; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 10px; font-size: 12px; }
        
        /* Box Hỗ Trợ */
        .support-box { background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 14px; padding: 14px; margin-top: 16px; }
        .support-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .support-links { display: flex; gap: 10px; }
        .support-btn { flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; color: #fff; background: #1e293b; }
        .support-btn.zalo { background: #0068ff; }
        .support-btn.telegram { background: #0088cc; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fa-brands fa-tiktok"></i> TikTok Auto API</div>
        <div class="nav-actions" id="authArea"></div>
    </div>

    <div class="balance-container" id="balanceArea" style="display: none;">
        <div class="balance-card">
            <div class="balance-title"><i class="fa-solid fa-wallet"></i> Số Dư Sử Dụng</div>
            <div class="balance-value" id="usableBalance">0 đ</div>
        </div>
        <div class="balance-card" id="apiBalanceCard" style="display: none;">
            <div class="balance-title"><i class="fa-solid fa-server"></i> Số Dư API Thực</div>
            <div class="balance-value api" id="apiRealBalance">0 đ</div>
        </div>
    </div>

    <div class="card">
        <div class="main-tabs">
            <div class="tab-item active" onclick="switchTab('orderTab', this)"><i class="fa-solid fa-cart-shopping"></i> Đặt Đơn</div>
            <div class="tab-item" onclick="switchTab('historyTab', this); loadOrders();"><i class="fa-solid fa-clock-rotate-left"></i> Đơn Hàng</div>
            <div class="tab-item" onclick="switchTab('changesTab', this); loadChanges();"><i class="fa-solid fa-money-bill-transfer"></i> Biến Động</div>
            <div class="tab-item" onclick="switchTab('profileTab', this); loadProfile();"><i class="fa-solid fa-user-gear"></i> Tài Khoản</div>
            <div class="tab-item" id="adminTabNav" style="display: none;" onclick="switchTab('adminTab', this); loadAdminData();"><i class="fa-solid fa-shield-halved"></i> Quản Lý</div>
        </div>

        <div class="tab-content active" id="orderTab">
            <form id="orderForm">
                <div class="form-group">
                    <label>Phân loại dịch vụ TikTok:</label>
                    <select id="categorySelect" onchange="filterServices()"></select>
                </div>
                <div class="form-group">
                    <label>Dịch vụ cụ thể:</label>
                    <select id="serviceSelect" onchange="updateDetails()"></select>
                </div>
                <div class="form-group">
                    <label>Link Video / Profile TikTok:</label>
                    <input type="url" id="link" placeholder="https://www.tiktok.com/@..." required>
                </div>
                <div class="form-group">
                    <label>Số lượng:</label>
                    <input type="number" id="quantity" value="1000" oninput="calculateTotal()" required>
                    <small id="limitHint" style="color: #64748b; font-size: 11px; margin-top: 4px; display: block;"></small>
                </div>
                <div class="total-box">
                    <span style="font-size: 12px; color: #94a3b8;">Tổng tiền cần thanh toán:</span>
                    <div class="total-price" id="totalPrice">0 đ</div>
                </div>
                <button type="submit" class="btn-submit">Tạo Đơn Hàng Ngay</button>
            </form>
        </div>

        <div class="tab-content" id="historyTab"><div id="historyList">Chưa có đơn hàng nào.</div></div>
        <div class="tab-content" id="changesTab"><div id="changesList">Chưa có biến động số dư.</div></div>
        <div class="tab-content" id="profileTab"><div id="profileContent"></div></div>
        
        <!-- Tab Admin Quản Lý Tài Khoản -->
        <div class="tab-content" id="adminTab">
            <h4 style="margin-bottom: 12px; color: #38bdf8;">Cộng / Trừ Tiền Thành Viên</h4>
            <div class="form-group">
                <label>Tên tài khoản nhận:</label>
                <input type="text" id="adminTargetUser" placeholder="Nhập username">
            </div>
            <div class="form-group">
                <label>Số tiền (VNĐ):</label>
                <input type="number" id="adminAmount" placeholder="Ví dụ: 100000">
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn btn-login" style="flex:1; justify-content:center;" onclick="adjustBalance('add')">Cộng Tiền</button>
                <button class="btn btn-logout" style="flex:1; justify-content:center;" onclick="adjustBalance('subtract')">Trừ Tiền</button>
            </div>
            <h4 style="margin-bottom: 12px; color: #38bdf8;">Danh Sách Người Dùng</h4>
            <div id="adminUserList"></div>
        </div>
    </div>

    <!-- KHU VỰC HỖ TRỢ KHÁCH HÀNG -->
    <div class="support-box">
        <div class="support-title"><i class="fa-solid fa-headset"></i> Trung Tâm Hỗ Trợ Kỹ Thuật</div>
        <div class="support-links">
            <a href="https://zalo.me" target="_blank" class="support-btn zalo"><i class="fa-solid fa-comment"></i> Zalo Support</a>
            <a href="https://t.me" target="_blank" class="support-btn telegram"><i class="fa-paper-plane"></i> Telegram</a>
        </div>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 12px;">Đăng Nhập</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" id="loginUsername" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('user'));
    let apiServices = [];
    let currentCalculatedPrice = 0;

    function formatMoney(amount) {
        let num = Number(amount) || 0;
        return num.toLocaleString('vi-VN') + ' đ';
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-item').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        element.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function updateAuthUI() {
        const authArea = document.getElementById('authArea');
        const balanceArea = document.getElementById('balanceArea');
        const adminTabNav = document.getElementById('adminTabNav');

        if (currentUser) {
            authArea.innerHTML = `
                <div class="user-info-tag"><i class="fa-solid fa-user"></i> ${currentUser.username}</div>
                <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;
            balanceArea.style.display = 'grid';

            if (currentUser.role === 'root_admin') {
                adminTabNav.style.display = 'flex';
            } else {
                adminTabNav.style.display = 'none';
            }

            loadBalance();
        } else {
            authArea.innerHTML = `<button class="btn btn-login" onclick="document.getElementById('loginModal').style.display='flex'">Đăng Nhập</button>`;
            balanceArea.style.display = 'none';
            adminTabNav.style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        updateAuthUI();
    }

    // Tải số dư chuẩn trực tiếp từ Server
    async function loadBalance() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/api/user/balance?username=${encodeURIComponent(currentUser.username)}`);
            const data = await res.json();
            if (data.status === 'success') {
                // Cập nhật giá trị hiển thị số dư khả dụng thực tế
                document.getElementById('usableBalance').innerText = formatMoney(data.usableBalance);
                
                // Cập nhật lại localStorage để tránh bị lệch tiền cũ
                currentUser.balance = data.usableBalance;
                localStorage.setItem('user', JSON.stringify(currentUser));

                if (data.role === 'root_admin') {
                    document.getElementById('apiBalanceCard').style.display = 'block';
                    document.getElementById('apiRealBalance').innerText = formatMoney(data.realApiBalance);
                } else {
                    document.getElementById('apiBalanceCard').style.display = 'none';
                }
            }
        } catch (err) {
            console.error("Lỗi lấy số dư:", err);
        }
    }

    async function fetchApiServices() {
        try {
            const res = await fetch('/api/services');
            const data = await res.json();

            if (data.status === 'success' && Array.isArray(data.data) && data.data.length > 0) {
                apiServices = data.data;

                const categories = [...new Set(apiServices.map(s => s.category))];
                const catSelect = document.getElementById('categorySelect');
                catSelect.innerHTML = '';
                categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

                filterServices();
            } else {
                document.getElementById('categorySelect').innerHTML = '<option>Không có dịch vụ TikTok</option>';
            }
        } catch (e) {
            console.error("Lỗi lấy dịch vụ:", e);
        }
    }

    function filterServices() {
        const cat = document.getElementById('categorySelect').value;
        const filtered = apiServices.filter(s => s.category === cat);
        const serviceSelect = document.getElementById('serviceSelect');
        serviceSelect.innerHTML = '';
        
        filtered.forEach(s => {
            serviceSelect.innerHTML += `<option value="${s.service}">[ID ${s.service}] ${s.name} - ${formatMoney(s.rate)}/1k</option>`;
        });
        
        updateDetails();
    }

    function updateDetails() {
        const serviceId = document.getElementById('serviceSelect').value;
        const service = apiServices.find(s => s.service == serviceId);
        if (service) {
            document.getElementById('limitHint').innerText = `Tối thiểu: ${Number(service.min).toLocaleString('vi-VN')} - Tối đa: ${Number(service.max).toLocaleString('vi-VN')}`;
            calculateTotal();
        }
    }

    function calculateTotal() {
        const serviceId = document.getElementById('serviceSelect').value;
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        const service = apiServices.find(s => s.service == serviceId);

        if (service) {
            currentCalculatedPrice = (qty / 1000) * Number(service.rate);
            document.getElementById('totalPrice').innerText = formatMoney(currentCalculatedPrice);
        }
    }

    function loadProfile() {
        const profileBox = document.getElementById('profileContent');
        if (!currentUser) {
            profileBox.innerHTML = '<p style="color: #94a3b8; text-align: center;">Vui lòng đăng nhập để xem thông tin!</p>';
            return;
        }

        profileBox.innerHTML = `
            <div class="list-item">
                <p style="margin-bottom: 6px;"><strong>Tên tài khoản:</strong> ${currentUser.username}</p>
                <p style="margin-bottom: 6px;"><strong>Chức vụ:</strong> ${currentUser.role === 'root_admin' ? 'Root Admin (Quản trị viên)' : 'Thành viên'}</p>
                <p><strong>Trạng thái:</strong> <span style="color: #34d399;">Đã xác minh</span></p>
            </div>
        `;
    }

    async function loadAdminData() {
        if (!currentUser || currentUser.role !== 'root_admin') return;
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        const box = document.getElementById('adminUserList');

        if (data.status === 'success') {
            box.innerHTML = data.data.map(u => `
                <div class="list-item">
                    <p><strong>Username:</strong> ${u.username} (${u.role})</p>
                    <p><strong>Số dư:</strong> ${formatMoney(u.balance)}</p>
                </div>
            `).join('');
        }
    }

    async function adjustBalance(type) {
        const targetUsername = document.getElementById('adminTargetUser').value.trim();
        const amount = document.getElementById('adminAmount').value;

        if (!targetUsername || !amount) return alert('Vui lòng điền đủ thông tin');

        const res = await fetch('/api/admin/adjust-balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                adminUsername: currentUser.username,
                targetUsername: targetUsername,
                amount: amount,
                type: type
            })
        });

        const data = await res.json();
        alert(data.message);
        if (data.status === 'success') {
            loadBalance();
            loadAdminData();
        }
    }

    async function loadOrders() {
        if (!currentUser) return;
        const res = await fetch(`/api/user/orders?username=${encodeURIComponent(currentUser.username)}`);
        const data = await res.json();
        const box = document.getElementById('historyList');

        if (data.status === 'success' && data.data.length > 0) {
            box.innerHTML = data.data.map(o => `
                <div class="list-item">
                    <p><strong>Mã đơn API:</strong> #${o.id}</p>
                    <p><strong>Dịch vụ ID:</strong> ${o.service}</p>
                    <p><strong>Số lượng:</strong> ${o.quantity}</p>
                    <p><strong>Tổng tiền:</strong> ${formatMoney(o.price)}</p>
                    <p style="color:#64748b; font-size: 10px; margin-top:4px;">${o.createdAt}</p>
                </div>
            `).join('');
        } else {
            box.innerHTML = '<p style="color: #94a3b8; text-align: center;">Chưa có đơn hàng nào.</p>';
        }
    }

    async function loadChanges() {
        if (!currentUser) return;
        const res = await fetch(`/api/user/balance-changes?username=${encodeURIComponent(currentUser.username)}`);
        const data = await res.json();
        const box = document.getElementById('changesList');

        if (data.status === 'success' && data.data.length > 0) {
            box.innerHTML = data.data.map(c => `
                <div class="list-item">
                    <p><strong>Nội dung:</strong> ${c.description}</p>
                    <p><strong>Số tiền:</strong> <span style="color: ${c.amount < 0 ? '#f87171' : '#34d399'};">${formatMoney(c.amount)}</span></p>
                    <p><strong>Số dư sau GD:</strong> ${formatMoney(c.lastBalance)}</p>
                    <p style="color:#64748b; font-size: 10px; margin-top:4px;">${c.time}</p>
                </div>
            `).join('');
        } else {
            box.innerHTML = '<p style="color: #94a3b8; text-align: center;">Chưa có biến động số dư.</p>';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('loginUsername').value.trim(),
                password: document.getElementById('loginPassword').value
            })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            currentUser = data.user;
            document.getElementById('loginModal').style.display = 'none';
            updateAuthUI();
        } else {
            alert(data.message);
        }
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("Vui lòng đăng nhập!");

        const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: currentUser.username,
                service: document.getElementById('serviceSelect').value,
                link: document.getElementById('link').value,
                quantity: document.getElementById('quantity').value,
                price: currentCalculatedPrice
            })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
            alert(`Tạo đơn thành công! Mã đơn API #${data.orderId}`);
            loadBalance();
        } else {
            alert(`Lỗi: ${data.message}`);
        }
    });

    updateAuthUI();
    fetchApiServices();
</script>
</body>
</html>
