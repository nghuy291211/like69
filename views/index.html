<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ TikTok Auto</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
        body { background: #090d16; color: #f1f5f9; padding: 16px 12px; }
        .container { max-width: 520px; margin: 0 auto; }

        /* ==================== NAVBAR ==================== */
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo { 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .logo i {
            -webkit-text-fill-color: initial;
            color: #38bdf8;
            font-size: 19px;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
        }

        .nav-actions { display: flex; align-items: center; gap: 8px; }

        /* ==================== BUTTONS DESIGN MỚI ==================== */
        .btn { 
            border: none; 
            padding: 9px 15px; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 13px; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            text-decoration: none;
        }

        .btn-login { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: #fff; 
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        .btn-login:active { transform: scale(0.96); }

        .btn-admin {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }

        .btn-logout { 
            background: rgba(239, 68, 68, 0.12); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .user-info-tag {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ==================== SỐ DƯ CARD ==================== */
        .balance-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .balance-card { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            padding: 14px; 
            border-radius: 16px; 
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, #10b981, transparent);
        }
        .balance-card.api::before { background: linear-gradient(90deg, #38bdf8, transparent); }
        .balance-title { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .balance-value { font-size: 18px; font-weight: 800; margin-top: 4px; color: #34d399; }
        .balance-value.api { color: #38bdf8; }

        /* ==================== CARD & FORM ==================== */
        .card { 
            background: #0f172a; 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 32px rgba(0,0,0,0.4); 
        }

        h3 { margin-bottom: 16px; font-size: 16px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        
        select, input { 
            width: 100%; 
            padding: 12px 14px; 
            border-radius: 12px; 
            border: 1px solid #1e293b; 
            background: #070a12; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
            transition: all 0.2s;
        }
        select:focus, input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .total-box { 
            background: rgba(7, 10, 18, 0.7); 
            border: 1px dashed rgba(52, 211, 153, 0.3); 
            padding: 14px; 
            border-radius: 14px; 
            text-align: center; 
            margin: 18px 0; 
        }
        .total-price { font-size: 22px; font-weight: 800; color: #34d399; margin-top: 4px; }

        /* Nút Tạo Đơn Hàng Ngay - Thiết kế mới */
        button.btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button.btn-submit:active { transform: scale(0.98); }

        /* ==================== MODAL POPUP ==================== */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(3, 7, 18, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }

        .modal-content { 
            background: #0f172a; 
            padding: 28px 24px; 
            border-radius: 22px; 
            width: 90%; 
            max-width: 360px; 
            position: relative; 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
        }

        .close-modal { 
            position: absolute; 
            right: 16px; 
            top: 16px; 
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px; 
            color: #94a3b8; 
            cursor: pointer; 
        }

        .login-header { text-align: center; margin-bottom: 20px; }
        .login-icon-box {
            width: 54px; height: 54px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            color: #38bdf8; font-size: 22px;
        }

        .loading-content { text-align: center; padding: 30px 20px; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #10b981; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 18px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #alert { display: none; padding: 12px; border-radius: 10px; margin-top: 14px; font-size: 13px; font-weight: 600; text-align: center; }
        .success { background: rgba(6, 78, 59, 0.8); color: #6ee7b7; border: 1px solid #10b981; }
        .error { background: rgba(127, 29, 29, 0.8); color: #fca5a5; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo"><i class="fa-brands fa-tiktok"></i> TikTok Auto</div>
        <div class="nav-actions" id="authArea">
            <button class="btn btn-login" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>
        </div>
    </div>

    <!-- SỐ DƯ -->
    <div class="balance-container" id="balanceArea" style="display: none;">
        <div class="balance-card">
            <div class="balance-title"><i class="fa-solid fa-wallet"></i> Số Dư Sử Dụng</div>
            <div class="balance-value" id="usableBalance">0 đ</div>
        </div>
        <div class="balance-card api" id="apiBalanceCard" style="display: none;">
            <div class="balance-title"><i class="fa-solid fa-server"></i> Số Dư API Thực</div>
            <div class="balance-value api" id="apiRealBalance">0 đ</div>
        </div>
    </div>

    <!-- FORM ĐẶT ĐƠN TIKTOK -->
    <div class="card">
        <h3><i class="fa-solid fa-cart-shopping" style="color: #10b981;"></i> Đặt Đơn TikTok Tự Động</h3>
        <form id="orderForm">
            <div class="form-group">
                <label>Phân loại dịch vụ:</label>
                <select id="categorySelect" onchange="filterServices()"></select>
            </div>

            <div class="form-group">
                <label>Dịch vụ cụ thể:</label>
                <select id="serviceSelect" onchange="updateDetails()"></select>
            </div>

            <div class="form-group">
                <label>Link Video / Profile TikTok:</label>
                <input type="url" id="link" placeholder="https://www.tiktok.com/@..." required>
            </div>

            <div class="form-group">
                <label>Số lượng:</label>
                <input type="number" id="quantity" value="1000" oninput="calculateTotal()" required>
                <small id="limitHint" style="color: #64748b; font-size: 11px; margin-top: 4px; display: block;"></small>
            </div>

            <div class="total-box">
                <span style="font-size: 12px; color: #94a3b8;">Tổng tiền cần thanh toán:</span>
                <div class="total-price" id="totalPrice">0 đ</div>
            </div>

            <button type="submit" class="btn-submit" id="orderBtn">
                <i class="fa-solid fa-bolt"></i> Tạo Đơn Hàng Ngay
            </button>
        </form>
        <div id="alert"></div>
    </div>
</div>

<!-- MODAL ĐĂNG NHẬP -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <div class="close-modal" onclick="closeLoginModal()"><i class="fa-solid fa-xmark"></i></div>
        <div class="login-header">
            <div class="login-icon-box"><i class="fa-solid fa-shield-halved"></i></div>
            <h3 style="justify-content: center; margin-bottom: 2px;">Đăng Nhập</h3>
            <p style="font-size: 12px; color: #64748b;">Nhập tài khoản để tiếp tục</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" id="loginUsername" required placeholder="Tên tài khoản...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); margin-top: 10px;">
                Đăng Nhập
            </button>
        </form>
    </div>
</div>

<!-- POPUP LOADING -->
<div class="modal" id="loadingModal">
    <div class="modal-content loading-content">
        <div class="spinner"></div>
        <div style="font-size: 16px; font-weight: 700; color: #fff;">Hiện đang đặt hàng...</div>
        <div style="font-size: 12px; color: #fbbf24; margin-top: 6px;">Vui lòng không tắt trang web</div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('user'));
    let allServices = [];

    function formatMoney(amount) {
        if (amount === null || amount === undefined || isNaN(amount)) return '0 đ';
        let numStr = Number(amount).toFixed(3); 
        let [integerPart, decimalPart] = numStr.split('.');
        let formattedInteger = parseInt(integerPart, 10).toLocaleString('vi-VN');
        decimalPart = decimalPart.replace(/0+$/, '');
        return decimalPart.length > 0 ? `${formattedInteger},${decimalPart} đ` : `${formattedInteger} đ`;
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function showLoading() { document.getElementById('loadingModal').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingModal').style.display = 'none'; }

    function updateAuthUI() {
        const authArea = document.getElementById('authArea');
        const balanceArea = document.getElementById('balanceArea');

        if (currentUser) {
            let adminBtn = '';
            if (currentUser.role === 'root_admin') {
                adminBtn = `<a href="/admin.html" class="btn btn-admin"><i class="fa-solid fa-user-gear"></i> Admin</a>`;
            }

            authArea.innerHTML = `
                ${adminBtn}
                <div class="user-info-tag"><i class="fa-solid fa-user"></i> ${currentUser.username}</div>
                <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;
            balanceArea.style.display = 'grid';
            loadBalance();
        } else {
            authArea.innerHTML = `<button class="btn btn-login" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>`;
            balanceArea.style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        updateAuthUI();
    }

    async function loadBalance() {
        if (!currentUser) return;
        const res = await fetch(`/api/user/balance?username=${currentUser.username}`);
        const data = await res.json();
        if (data.status === 'success') {
            document.getElementById('usableBalance').innerText = formatMoney(data.usableBalance || data.balance || 0);
            if (data.role === 'root_admin') {
                document.getElementById('apiBalanceCard').style.display = 'block';
                document.getElementById('apiRealBalance').innerText = formatMoney(data.realApiBalance || 0);
            }
        }
    }

    async function loadServices() {
        const res = await fetch('/api/services');
        const data = await res.json();
        if (data.status === 'success' && data.data.length > 0) {
            allServices = data.data;
            const categories = [...new Set(allServices.map(s => s.category))];
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '';
            categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);
            filterServices();
        }
    }

    function filterServices() {
        const cat = document.getElementById('categorySelect').value;
        const filtered = allServices.filter(s => s.category === cat);
        const serviceSelect = document.getElementById('serviceSelect');
        serviceSelect.innerHTML = '';
        filtered.forEach(s => {
            serviceSelect.innerHTML += `<option value="${s.service}">[ID ${s.service}] ${s.name} - ${formatMoney(s.rate)} / 1k</option>`;
        });
        updateDetails();
    }

    function updateDetails() {
        const serviceId = document.getElementById('serviceSelect').value;
        const service = allServices.find(s => s.service == serviceId);
        if (service) {
            document.getElementById('limitHint').innerText = `Tối thiểu: ${service.min.toLocaleString('vi-VN')} - Tối đa: ${service.max.toLocaleString('vi-VN')}`;
            calculateTotal();
        }
    }

    function calculateTotal() {
        const serviceId = document.getElementById('serviceSelect').value;
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        const service = allServices.find(s => s.service == serviceId);
        if (service) {
            const total = (qty / 1000) * service.rate;
            document.getElementById('totalPrice').innerText = formatMoney(total);
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('loginUsername').value.trim(),
                password: document.getElementById('loginPassword').value
            })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            currentUser = data.user;
            closeLoginModal();
            updateAuthUI();
        } else {
            alert(data.message);
        }
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) { alert("Vui lòng đăng nhập trước!"); openLoginModal(); return; }
        const alertBox = document.getElementById('alert');
        alertBox.style.display = 'none';
        showLoading();
        try {
            const serviceId = document.getElementById('serviceSelect').value;
            const qty = document.getElementById('quantity').value;
            const service = allServices.find(s => s.service == serviceId);
            const cost = (qty / 1000) * service.rate;

            const res = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: currentUser.username,
                    service: serviceId,
                    link: document.getElementById('link').value,
                    quantity: qty,
                    price: cost
                })
            });

            const data = await res.json();
            hideLoading();
            alertBox.style.display = 'block';
            if (res.ok && data.status === 'success') {
                alertBox.className = 'success';
                alertBox.innerText = `Đặt đơn thành công! Mã đơn: ${data.orderId}`;
                loadBalance();
            } else {
                alertBox.className = 'error';
                alertBox.innerText = `Lỗi: ${data.message || 'Không thể tạo đơn'}`;
            }
        } catch (error) {
            hideLoading();
            alertBox.style.display = 'block';
            alertBox.className = 'error';
            alertBox.innerText = "Lỗi kết nối máy chủ";
        }
    });

    updateAuthUI();
    loadServices();
</script>
</body>
</html>
