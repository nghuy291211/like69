<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Auto API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto space-y-4">
        <!-- Header -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <h1 class="text-lg font-bold text-cyan-400">TikTok Auto API</h1>
            <span id="currentUser" class="text-sm bg-slate-800 px-3 py-1 rounded-lg"></span>
        </div>

        <!-- Số dư -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400">SỐ DƯ SỬ DỤNG</p>
                <p id="usableBalance" class="text-xl font-extrabold text-emerald-400">0 đ</p>
            </div>
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                <p class="text-xs text-slate-400">SỐ DƯ API THỰC</p>
                <p id="realApiBalance" class="text-xl font-extrabold text-cyan-400">0 đ</p>
            </div>
        </div>

        <!-- Form Đặt Đơn & Lọc Dịch Vụ -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <div>
                <label class="text-xs text-slate-400">Phân loại dịch vụ:</label>
                <select id="categorySelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 mt-1 text-sm outline-none">
                    <option value="">-- Chọn danh mục --</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400">Dịch vụ cụ thể:</label>
                <select id="serviceSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 mt-1 text-sm outline-none">
                    <option value="">-- Chọn dịch vụ --</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let servicesData = [];
        const loggedUser = localStorage.getItem('username') || 'admin'; // Giả lập user đang đăng nhập để test
        document.getElementById('currentUser').innerText = loggedUser;

        // Load Số dư
        async function fetchBalance() {
            try {
                const res = await fetch(`/api/user/balance?username=${loggedUser}`);
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('usableBalance').innerText = Number(data.usableBalance).toLocaleString() + ' đ';
                    document.getElementById('realApiBalance').innerText = Number(data.realApiBalance).toLocaleString() + ' đ';
                }
            } catch(e) { console.error(e); }
        }

        // Load và Lọc Dịch Vụ chuẩn từ API
        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                const json = await res.json();
                if(json.status === 'success' && Array.isArray(json.data)) {
                    servicesData = json.data;
                    
                    // Lọc danh mục (category) duy nhất
                    const categories = [...new Set(servicesData.map(s => s.category))];
                    const catSelect = document.getElementById('categorySelect');
                    catSelect.innerHTML = '<option value="">-- Chọn danh mục --</option>';
                    
                    categories.forEach(cat => {
                        const opt = document.createElement('option');
                        opt.value = cat;
                        opt.textContent = cat;
                        catSelect.appendChild(opt);
                    });
                }
            } catch(e) { console.error(e); }
        }

        // Sự kiện khi chọn Danh mục -> Lọc Dịch vụ tương ứng
        document.getElementById('categorySelect').addEventListener('change', function(e) {
            const selectedCat = e.target.value;
            const serviceSelect = document.getElementById('serviceSelect');
            serviceSelect.innerHTML = '<option value="">-- Chọn dịch vụ --</option>';

            const filtered = servicesData.filter(s => s.category === selectedCat);
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.service;
                opt.textContent = `[ID ${s.service}] ${s.name} - ${s.rate}đ`;
                serviceSelect.appendChild(opt);
            });
        });

        fetchBalance();
        fetchServices();
    </script>
</body>
</html>
