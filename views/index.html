<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ TikTok Auto</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #090d16; color: #e2e8f0; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 12px 18px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; }
        .logo { font-size: 17px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-login { background: #10b981; color: #fff; }
        .btn-logout { background: #ef4444; color: #fff; }

        .balance-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .balance-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); padding: 15px; border-radius: 12px; }
        .balance-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
        .balance-value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #10b981; }
        .balance-value.api { color: #38bdf8; }

        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h3 { margin-bottom: 16px; font-size: 16px; color: #f8fafc; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }

        .total-box { background: #0f172a; border: 1px dashed #334155; padding: 12px; border-radius: 8px; text-align: center; margin: 15px 0; }
        .total-price { font-size: 20px; font-weight: bold; color: #10b981; }

        button.btn-submit { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
        
        .admin-nav { display: flex; gap: 8px; margin-bottom: 15px; }
        .admin-nav .btn-tab { flex: 1; padding: 10px; background: #0f172a; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; text-align: center; }
        .admin-nav .btn-tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; font-size: 13px; }
        th { background: #0f172a; color: #38bdf8; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; position: relative; }
        .close-modal { position: absolute; right: 15px; top: 15px; font-size: 18px; color: #94a3b8; cursor: pointer; }

        #alert { display: none; padding: 10px; border-radius: 6px; margin-top: 12px; font-size: 13px; }
        .success { background: #064e3b; color: #6ee7b7; }
        .error { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fa-brands fa-tiktok"></i> TikTok Auto</div>
        <div id="authArea">
            <button class="btn btn-login" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>
        </div>
    </div>

    <div class="balance-container" id="balanceArea" style="display: none;">
        <div class="balance-card">
            <div class="balance-title">Số Dư Sử Dụng</div>
            <div class="balance-value" id="usableBalance">0 đ</div>
        </div>
        <div class="balance-card" id="apiBalanceCard" style="display: none;">
            <div class="balance-title">Số Dư API Thực</div>
            <div class="balance-value api" id="apiRealBalance">0 đ</div>
        </div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-cart-shopping" style="color: #10b981;"></i> Đặt Đơn TikTok Tự Động</h3>
        <form id="orderForm">
            <div class="form-group">
                <label>Phân loại dịch vụ:</label>
                <select id="categorySelect" onchange="filterServices()"></select>
            </div>

            <div class="form-group">
                <label>Dịch vụ cụ thể:</label>
                <select id="serviceSelect" onchange="updateDetails()"></select>
            </div>

            <div class="form-group">
                <label>Link Video / Profile TikTok:</label>
                <input type="url" id="link" placeholder="https://www.tiktok.com/@..." required>
            </div>

            <div class="form-group">
                <label>Số lượng:</label>
                <input type="number" id="quantity" value="1000" oninput="calculateTotal()" required>
                <small id="limitHint" style="color: #64748b; font-size: 11px;"></small>
            </div>

            <div class="total-box">
                Tổng tiền cần thanh toán: <div class="total-price" id="totalPrice">0 đ</div>
            </div>

            <button type="submit" class="btn-submit">Tạo Đơn Hàng Ngay</button>
        </form>
        <div id="alert"></div>
    </div>

    <div class="card" id="adminPanel" style="display: none; border: 1px solid #38bdf8;">
        <h3 style="color: #38bdf8;"><i class="fa-solid fa-user-gear"></i> Quản Lý Tài Khoản (Admin Gốc)</h3>
        
        <div class="admin-nav">
            <div class="btn-tab active" id="tabCreateBtn" onclick="switchAdminTab('create')"><i class="fa-solid fa-user-plus"></i> Tạo Acc</div>
            <div class="btn-tab" id="tabBalanceBtn" onclick="switchAdminTab('balance')"><i class="fa-solid fa-coins"></i> Cài Số Dư</div>
            <div class="btn-tab" id="tabListBtn" onclick="switchAdminTab('list')"><i class="fa-solid fa-list"></i> Danh Sách Acc</div>
        </div>

        <form id="createAccForm">
            <div class="form-group">
                <label>Tên đăng nhập mới:</label>
                <input type="text" id="newUsername" placeholder="Nhập tên user..." required>
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="text" id="newPassword" placeholder="Nhập mật khẩu..." required>
            </div>
            <div class="form-group">
                <label>Số dư ban đầu (VNĐ):</label>
                <input type="number" id="initialBalance" value="0">
            </div>
            <button type="submit" class="btn-submit" style="background: #0284c7;">Tạo Tài Khoản Con</button>
        </form>

        <form id="updateBalanceForm" style="display: none;">
            <div class="form-group">
                <label>Tên đăng nhập cần chỉnh sửa:</label>
                <input type="text" id="targetUsername" placeholder="Nhập chính xác tên user..." required>
            </div>
            <div class="form-group">
                <label>Hình thức:</label>
                <select id="actionType">
                    <option value="add">Cộng thêm số dư</option>
                    <option value="set">Đặt lại số dư mới</option>
                </select>
            </div>
            <div class="form-group">
                <label>Số tiền (VNĐ):</label>
                <input type="number" id="amount" placeholder="Nhập số tiền..." required>
            </div>
            <button type="submit" class="btn-submit" style="background: #10b981;">Cập Nhật Số Dư</button>
        </form>

        <div id="userListSection" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Tên Tài Khoản</th>
                        <th>Số Dư Hiển Thị</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <i class="fa-solid fa-xmark close-modal" onclick="closeLoginModal()"></i>
        <h3 style="margin-bottom: 20px;"><i class="fa-solid fa-lock" style="color: #38bdf8;"></i> Đăng Nhập</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" id="loginUsername" required placeholder="Tên tài khoản">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" required placeholder="Mật khẩu">
            </div>
            <button type="submit" class="btn-submit" style="margin-top: 10px;">Đăng Nhập</button>
        </form>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('user'));
    let allServices = [];

    // Định dạng lấy toàn bộ số nguyên + tối đa 3 số thập phân sau dấu phẩy
    function formatMoney(amount) {
        if (amount === null || amount === undefined || isNaN(amount)) return '0 đ';
        
        let numStr = Number(amount).toFixed(3); 
        let [integerPart, decimalPart] = numStr.split('.');
        let formattedInteger = parseInt(integerPart, 10).toLocaleString('vi-VN');
        decimalPart = decimalPart.replace(/0+$/, '');

        if (decimalPart.length > 0) {
            return `${formattedInteger},${decimalPart} đ`;
        }
        return `${formattedInteger} đ`;
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    function updateAuthUI() {
        const authArea = document.getElementById('authArea');
        const balanceArea = document.getElementById('balanceArea');
        const adminPanel = document.getElementById('adminPanel');

        if (currentUser) {
            authArea.innerHTML = `
                <span style="font-size: 13px; font-weight: 600; color:#38bdf8; margin-right: 5px;"><i class="fa-solid fa-user"></i> ${currentUser.username}</span>
                <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            `;
            balanceArea.style.display = 'grid';
            loadBalance();
        } else {
            authArea.innerHTML = `<button class="btn btn-login" onclick="openLoginModal()"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</button>`;
            balanceArea.style.display = 'none';
            adminPanel.style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        updateAuthUI();
    }

    async function loadBalance() {
        if (!currentUser) return;
        const res = await fetch(`/api/user/balance?username=${currentUser.username}`);
        const data = await res.json();

        if (data.status === 'success') {
            document.getElementById('usableBalance').innerText = formatMoney(data.usableBalance || data.balance || 0);

            if (data.role === 'root_admin') {
                document.getElementById('apiBalanceCard').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('apiRealBalance').innerText = formatMoney(data.realApiBalance || 0);
            }
        }
    }

    async function loadServices() {
        const res = await fetch('/api/services');
        const data = await res.json();

        if (data.status === 'success' && data.data.length > 0) {
            allServices = data.data;
            const categories = [...new Set(allServices.map(s => s.category))];
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '';
            categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

            filterServices();
        }
    }

    function filterServices() {
        const cat = document.getElementById('categorySelect').value;
        const filtered = allServices.filter(s => s.category === cat);
        const serviceSelect = document.getElementById('serviceSelect');
        serviceSelect.innerHTML = '';

        filtered.forEach(s => {
            serviceSelect.innerHTML += `<option value="${s.service}">[ID ${s.service}] ${s.name} - ${formatMoney(s.rate)} / 1k</option>`;
        });

        updateDetails();
    }

    function updateDetails() {
        const serviceId = document.getElementById('serviceSelect').value;
        const service = allServices.find(s => s.service == serviceId);
        if (service) {
            document.getElementById('limitHint').innerText = `Tối thiểu: ${service.min.toLocaleString('vi-VN')} - Tối đa: ${service.max.toLocaleString('vi-VN')}`;
            calculateTotal();
        }
    }

    function calculateTotal() {
        const serviceId = document.getElementById('serviceSelect').value;
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        const service = allServices.find(s => s.service == serviceId);
        if (service) {
            const total = (qty / 1000) * service.rate;
            document.getElementById('totalPrice').innerText = formatMoney(total);
        }
    }

    function switchAdminTab(tab) {
        document.getElementById('createAccForm').style.display = tab === 'create' ? 'block' : 'none';
        document.getElementById('updateBalanceForm').style.display = tab === 'balance' ? 'block' : 'none';
        document.getElementById('userListSection').style.display = tab === 'list' ? 'block' : 'none';

        document.getElementById('tabCreateBtn').className = `btn-tab ${tab === 'create' ? 'active' : ''}`;
        document.getElementById('tabBalanceBtn').className = `btn-tab ${tab === 'balance' ? 'active' : ''}`;
        document.getElementById('tabListBtn').className = `btn-tab ${tab === 'list' ? 'active' : ''}`;

        if (tab === 'list') loadUserList();
    }

    async function loadUserList() {
        const res = await fetch(`/api/admin/users?adminUsername=${currentUser.username}`);
        const data = await res.json();
        if (data.status === 'success') {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            if (data.data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#64748b;">Chưa có tài khoản con nào</td></tr>`;
                return;
            }
            data.data.forEach(u => {
                tbody.innerHTML += `<tr><td><b>${u.username}</b></td><td style="color:#10b981; font-weight:600;">${formatMoney(u.balance)}</td></tr>`;
            });
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('loginUsername').value.trim(),
                password: document.getElementById('loginPassword').value
            })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            currentUser = data.user;
            closeLoginModal();
            updateAuthUI();
        } else {
            alert(data.message);
        }
    });

    document.getElementById('createAccForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/admin/create-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                adminUsername: currentUser.username,
                newUsername: document.getElementById('newUsername').value.trim(),
                newPassword: document.getElementById('newPassword').value,
                initialBalance: document.getElementById('initialBalance').value
            })
        });
        const data = await res.json();
        alert(data.message);
        if (data.status === 'success') {
            document.getElementById('createAccForm').reset();
            loadBalance();
        }
    });

    document.getElementById('updateBalanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/admin/update-balance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                adminUsername: currentUser.username,
                targetUsername: document.getElementById('targetUsername').value.trim(),
                actionType: document.getElementById('actionType').value,
                amount: document.getElementById('amount').value
            })
        });
        const data = await res.json();
        alert(data.message);
        if (data.status === 'success') {
            document.getElementById('updateBalanceForm').reset();
            loadBalance();
        }
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước!");
            openLoginModal();
            return;
        }

        const serviceId = document.getElementById('serviceSelect').value;
        const qty = document.getElementById('quantity').value;
        const service = allServices.find(s => s.service == serviceId);
        const cost = (qty / 1000) * service.rate;

        const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: currentUser.username,
                service: serviceId,
                link: document.getElementById('link').value,
                quantity: qty,
                price: cost
            })
        });

        const data = await res.json();
        const alertBox = document.getElementById('alert');
        alertBox.style.display = 'block';

        if (res.ok && data.status === 'success') {
            alertBox.className = 'success';
            alertBox.innerText = `Đặt đơn thành công! Mã đơn: ${data.orderId}`;
            loadBalance();
        } else {
            alertBox.className = 'error';
            alertBox.innerText = data.message;
        }
    });

    updateAuthUI();
    loadServices();
</script>
</body>
</html>
