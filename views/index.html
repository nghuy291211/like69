<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Dịch Vụ Auto API</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background: #090d16; color: #f1f5f9; padding: 16px 12px; }
        .container { max-width: 520px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px; }
        .logo { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 8px; }
        .btn { border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-login { background: #10b981; color: #fff; }
        .btn-logout { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .user-info-tag { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); padding: 6px 10px; border-radius: 10px; font-size: 12px; color: #38bdf8; font-weight: 600; }
        .balance-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .balance-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.06); padding: 14px; border-radius: 16px; }
        .balance-title { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; }
        .balance-value { font-size: 18px; font-weight: 800; margin-top: 4px; color: #34d399; }
        .balance-value.api { color: #38bdf8; }
        .card { background: #0f172a; border-radius: 20px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.06); }
        .main-tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #050811; padding: 5px; border-radius: 14px; margin-bottom: 20px; gap: 4px; }
        .tab-item { text-align: center; padding: 10px 2px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #64748b; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-item.active { background: #1e293b; color: #38bdf8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #1e293b; background: #070a12; color: #fff; font-size: 13px; outline: none; }
        .total-box { background: rgba(7, 10, 18, 0.7); border: 1px dashed rgba(52, 211, 153, 0.3); padding: 14px; border-radius: 14px; text-align: center; margin: 18px 0; }
        .total-price { font-size: 22px; font-weight: 800; color: #34d399; margin-top: 4px; }
        button.btn-submit { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(3, 7, 18, 0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 24px; border-radius: 20px; width: 90%; max-width: 360px; border: 1px solid rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fa-brands fa-tiktok"></i> TikTok Auto API</div>
        <div class="nav-actions" id="authArea"></div>
    </div>

    <div class="balance-container" id="balanceArea" style="display: none;">
        <div class="balance-card">
            <div class="balance-title"><i class="fa-solid fa-wallet"></i> Số Dư Sử Dụng</div>
            <div class="balance-value" id="usableBalance">0 đ</div>
        </div>
        <div class="balance-card" id="apiBalanceCard" style="display: none;">
            <div class="balance-title"><i class="fa-solid fa-server"></i> Số Dư API Thực</div>
            <div class="balance-value api" id="apiRealBalance">0 đ</div>
        </div>
    </div>

    <div class="card">
        <div class="main-tabs">
            <div class="tab-item active" onclick="switchTab('orderTab', this)"><i class="fa-solid fa-cart-shopping"></i> Đặt Đơn</div>
            <div class="tab-item" onclick="switchTab('historyTab', this)"><i class="fa-solid fa-clock-rotate-left"></i> Đơn Hàng</div>
            <div class="tab-item" onclick="switchTab('changesTab', this)"><i class="fa-solid fa-money-bill-transfer"></i> Biến Động</div>
            <div class="tab-item" onclick="switchTab('profileTab', this)"><i class="fa-solid fa-user-gear"></i> Tài Khoản</div>
        </div>

        <div class="tab-content active" id="orderTab">
            <form id="orderForm">
                <div class="form-group">
                    <label>Phân loại dịch vụ:</label>
                    <select id="categorySelect" onchange="filterServices()"></select>
                </div>
                <div class="form-group">
                    <label>Dịch vụ cụ thể:</label>
                    <select id="serviceSelect" onchange="updateDetails()"></select>
                </div>
                <div class="form-group">
                    <label>Link Video / Profile TikTok:</label>
                    <input type="url" id="link" placeholder="https://www.tiktok.com/@..." required>
                </div>
                <div class="form-group">
                    <label>Số lượng:</label>
                    <input type="number" id="quantity" value="1000" oninput="calculateTotal()" required>
                    <small id="limitHint" style="color: #64748b; font-size: 11px; margin-top: 4px; display: block;"></small>
                </div>
                <div class="total-box">
                    <span style="font-size: 12px; color: #94a3b8;">Tổng tiền cần thanh toán:</span>
                    <div class="total-price" id="totalPrice">0 đ</div>
                </div>
                <button type="submit" class="btn-submit">Tạo Đơn Hàng Ngay</button>
            </form>
        </div>

        <div class="tab-content" id="historyTab"><div id="historyList"></div></div>
        <div class="tab-content" id="changesTab"><div id="changesList"></div></div>
        <div class="tab-content" id="profileTab"><div id="profileContent"></div></div>
    </div>
</div>

<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 12px;">Đăng Nhập</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" id="loginUsername" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">Đăng Nhập</button>
        </form>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('user'));
    let apiServices = [];
    let currentCalculatedPrice = 0;

    function formatMoney(amount) {
        let num = Number(amount) || 0;
        return num.toLocaleString('vi-VN', { maximumFractionDigits: 3 }) + ' đ';
    }

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-item').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
        element.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function updateAuthUI() {
        const authArea = document.getElementById('authArea');
        const balanceArea = document.getElementById('balanceArea');

        if (currentUser) {
            authArea.innerHTML = `
                <div class="user-info-tag"><i class="fa-solid fa-user"></i> ${currentUser.username}</div>
                <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;
            balanceArea.style.display = 'grid';
            loadBalance();
        } else {
            authArea.innerHTML = `<button class="btn btn-login" onclick="document.getElementById('loginModal').style.display='flex'">Đăng Nhập</button>`;
            balanceArea.style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        updateAuthUI();
    }

    async function loadBalance() {
        if (!currentUser) return;
        const res = await fetch(`/api/user/balance?username=${encodeURIComponent(currentUser.username)}`);
        const data = await res.json();
        if (data.status === 'success') {
            document.getElementById('usableBalance').innerText = formatMoney(data.usableBalance);
            if (data.role === 'root_admin') {
                document.getElementById('apiBalanceCard').style.display = 'block';
                document.getElementById('apiRealBalance').innerText = formatMoney(data.realApiBalance);
            }
        }
    }

    // Tải dịch vụ TRỰC TIẾP từ API
    async function fetchApiServices() {
        try {
            const res = await fetch('/api/services');
            const data = await res.json();
            if (data.status === 'success' && Array.isArray(data.data)) {
                apiServices = data.data;

                // Lấy danh sách danh mục (category) không trùng lặp từ API
                const categories = [...new Set(apiServices.map(s => s.category))];
                const catSelect = document.getElementById('categorySelect');
                catSelect.innerHTML = '';
                categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

                filterServices();
            }
        } catch (e) {
            console.error("Lỗi lấy dữ liệu API dịch vụ:", e);
        }
    }

    function filterServices() {
        const cat = document.getElementById('categorySelect').value;
        const filtered = apiServices.filter(s => s.category === cat);
        const serviceSelect = document.getElementById('serviceSelect');
        serviceSelect.innerHTML = '';
        filtered.forEach(s => {
            const rateFormatted = formatMoney(s.rate);
            serviceSelect.innerHTML += `<option value="${s.service}">[ID ${s.service}] ${s.name} - ${rateFormatted} / 1k</option>`;
        });
        updateDetails();
    }

    function updateDetails() {
        const serviceId = document.getElementById('serviceSelect').value;
        const service = apiServices.find(s => s.service == serviceId);
        if (service) {
            document.getElementById('limitHint').innerText = `Tối thiểu: ${Number(service.min).toLocaleString('vi-VN')} - Tối đa: ${Number(service.max).toLocaleString('vi-VN')}`;
            calculateTotal();
        }
    }

    function calculateTotal() {
        const serviceId = document.getElementById('serviceSelect').value;
        const qty = parseFloat(document.getElementById('quantity').value) || 0;
        const service = apiServices.find(s => s.service == serviceId);

        if (service) {
            // Rate của API là giá trên 1,000 lượt
            currentCalculatedPrice = (qty / 1000) * Number(service.rate);
            document.getElementById('totalPrice').innerText = formatMoney(currentCalculatedPrice);
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('loginUsername').value.trim(),
                password: document.getElementById('loginPassword').value
            })
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            currentUser = data.user;
            document.getElementById('loginModal').style.display = 'none';
            updateAuthUI();
        } else {
            alert(data.message);
        }
    });

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("Vui lòng đăng nhập!");

        const res = await fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: currentUser.username,
                service: document.getElementById('serviceSelect').value,
                link: document.getElementById('link').value,
                quantity: document.getElementById('quantity').value,
                price: currentCalculatedPrice
            })
        });

        const data = await res.json();
        if (res.ok && data.status === 'success') {
            alert(`Tạo đơn thành công! Mã đơn API #${data.orderId}`);
            loadBalance();
        } else {
            alert(`Lỗi: ${data.message}`);
        }
    });

    // Khởi tạo
    updateAuthUI();
    fetchApiServices();
</script>
</body>
</html>
