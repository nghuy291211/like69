<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đặt Đơn TikTok Tự Động</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 20px auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #cbd5e1; }
        select, input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        select:focus, input:focus { outline: none; border-color: #38bdf8; }
        .info-text { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .price-calculator { background: #0f172a; padding: 15px; border-radius: 6px; margin-top: 20px; margin-bottom: 20px; border: 1px dashed #38bdf8; font-weight: bold; color: #38bdf8; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #2563eb; border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #alert { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; line-height: 1.4; }
        .success { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
        .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐẶT ĐƠN TIKTOK AUTO</h2>

    <form id="orderForm">
        <div class="form-group">
            <label>Dịch vụ TikTok (Trực tiếp từ API):</label>
            <select id="serviceSelect" onchange="updateServiceInfo()"></select>
        </div>

        <div class="form-group">
            <label>Link TikTok (Video hoặc Profile):</label>
            <input type="url" id="link" placeholder="https://www.tiktok.com/@username/video/..." required>
        </div>

        <div class="form-group">
            <label>Số lượng:</label>
            <input type="number" id="quantity" value="1000" oninput="calculatePrice()" required>
            <div class="info-text" id="limitText">Tối thiểu: - | Tối đa: -</div>
        </div>

        <div class="price-calculator">
            Thành tiền: <span id="totalPrice">0 đ</span>
        </div>

        <button type="submit" id="btnSubmit">TẠO ĐƠN HÀNG NGAY</button>
    </form>

    <div id="alert"></div>
</div>

<script>
    let servicesList = [];

    // Tự động load danh sách dịch vụ khi mở trang
    async function fetchServices() {
        const select = document.getElementById('serviceSelect');
        select.innerHTML = '<option value="">Đang tải dịch vụ TikTok từ API...</option>';

        try {
            const res = await fetch('/api/services');
            const data = await res.json();

            if (data.status === 'success' && data.data.length > 0) {
                servicesList = data.data;
                select.innerHTML = '';
                
                servicesList.forEach(s => {
                    select.innerHTML += `<option value="${s.service}">[ID: ${s.service}] ${s.name} - ${s.rate.toLocaleString('vi-VN')}đ / 1k</option>`;
                });

                updateServiceInfo();
            } else {
                select.innerHTML = '<option value="">Không tìm thấy dịch vụ TikTok nào!</option>';
            }
        } catch (e) {
            select.innerHTML = '<option value="">Lỗi tải danh sách dịch vụ!</option>';
        }
    }

    function updateServiceInfo() {
        const serviceId = parseInt(document.getElementById('serviceSelect').value);
        const service = servicesList.find(s => s.service == serviceId);

        if (service) {
            document.getElementById('limitText').innerText = `Tối thiểu: ${service.min.toLocaleString('vi-VN')} | Tối đa: ${service.max.toLocaleString('vi-VN')}`;
            document.getElementById('quantity').min = service.min;
            document.getElementById('quantity').max = service.max;
            calculatePrice();
        }
    }

    function calculatePrice() {
        const serviceId = parseInt(document.getElementById('serviceSelect').value);
        const quantity = parseInt(document.getElementById('quantity').value) || 0;
        const service = servicesList.find(s => s.service == serviceId);

        if (service) {
            const total = (quantity / 1000) * service.rate;
            document.getElementById('totalPrice').innerText = total.toLocaleString('vi-VN') + ' đ';
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alert');
        
        btn.innerText = "Đang kết nối API đặt đơn...";
        btn.disabled = true;
        alertBox.style.display = 'none';

        const payload = {
            service: document.getElementById('serviceSelect').value,
            link: document.getElementById('link').value.trim(),
            quantity: document.getElementById('quantity').value
        };

        try {
            const res = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            alertBox.style.display = 'block';
            if (res.ok && result.status === 'success') {
                alertBox.className = 'success';
                alertBox.innerHTML = `<strong>ĐẶT ĐƠN THÀNH CÔNG!</strong><br>Mã đơn hàng nhà cung cấp: <strong>${result.orderId}</strong>`;
            } else {
                alertBox.className = 'error';
                alertBox.innerHTML = `<strong>TẠO ĐƠN THẤT BẠI:</strong> ${result.message}`;
            }
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.className = 'error';
            alertBox.innerText = "Lỗi kết nối tới Server!";
        } finally {
            btn.innerText = "TẠO ĐƠN HÀNG NGAY";
            btn.disabled = false;
        }
    });

    fetchServices();
</script>

</body>
</html>
